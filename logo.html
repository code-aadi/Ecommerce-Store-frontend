<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      
      .container{
        height: 100%;
      }

        .div1 {
            position: fixed;
        
         bottom: -10px;
           z-index: 11;
            left: -200px;
            animation: truck 10s infinite linear;

        }

        @keyframes truck {
            0% {
                left: -200px;
            }

            100% {
                left: 120%;
            }

        }
        .div2{
            display: inline-block;
           background-color: aqua;
          border-radius: 20px;
         transition-duration: 0.5s;
          animation: logo 2s infinite;
        }
        @keyframes logo {
            0%{
                background-color: rgb(206, 229, 237);
               
            }
            50%{
                background-color:rgb(255, 255, 253);
            }
            100%{
                background-color: rgb(206, 229, 237);
              
            }
            
            
        }
        @keyframes hover {

            
        }
        .div2:hover{
        
            transform: scale(1.1);
            transition: 0.6s;
        }
        .height{
         height: 500px;
        }
        
    </style>
</head>

<body>

    <div class="div0">
